{% extends 'base.html' %}

{% block title %}تسجيل الدخول - National Motors{% endblock %}

{% block extra_css %}
<style>
    /* الأنيميشن بتاع الخلفية */
    body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        /* دمجنا الكحلي بتاع ناشيونال موتورز مع الأحمر بدرجات مختلفة */
        background: linear-gradient(-45deg, #0f2e4a, #1a426b, #da291c, #0f2e4a);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* كود الحركة الانسيابية */
    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    /* تظبيط كارت اللوجين عشان ينطق على الخلفية المتحركة */
    .login-card {
        background: rgba(255, 255, 255, 0.95); /* شفافية بسيطة جداً */
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
        backdrop-filter: blur(5px); /* تأثير زجاجي خفيف */
    }

    .login-card img {
        max-width: 150px;
        margin-bottom: 20px;
    }

    /* تظبيط حقول الإدخال والزراير */
    .form-control {
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 15px;
        font-size: 0.9rem;
    }

    .btn-login {
        background-color: #da291c; /* الأحمر بتاع اللوجو */
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px;
        font-size: 1rem;
        font-weight: bold;
        transition: all 0.3s ease;
    }

    .btn-login:hover {
        background-color: #b51f15;
        transform: translateY(-2px); /* نطة خفيفة للزرار لما تقف عليه */
        box-shadow: 0 5px 15px rgba(218, 41, 28, 0.4);
    }
</style>
{% endblock %}

{% block content %}
<div class="login-card">
<div class="login-header">
    <img src="{{ url_for('static', filename='nm_logo.png') }}" alt="National Motors Logo" style="max-width: 180px; height: auto; margin-bottom: 15px;">
    
    <h1 style="color: var(--nm-blue); font-weight: 800; font-size: 1.8rem; margin-bottom: 5px;">NATIONAL MOTORS Portal</h1>
    <p style="color: #64748b; font-size: 0.9rem;"></p>
</div>
    <form class="login-body" method="POST" action="{{ url_for('support.login') }}">
        <input type="text" name="username" placeholder="User Name" required>
        
        <input type="password" name="password" placeholder="Password" required>
        
        <button type="submit" class="btn btn-danger" style="width: 100%; padding: 16px; font-size: 1.1rem; margin-top: 15px;">login</button>
        
        <div style="text-align: center; margin-top: 30px; font-size: 0.85rem; color: #94a3b8;">
            <p>© Developed by Eng:Mohamed EL-Sayed</p>
            <p>© V1.1 (2026)</p>
            <p>© 2026 جميع الحقوق محفوظة لشركة ناشيونال موتورز</p>

        </div>
    </form>
</div>
{% endblock %}
