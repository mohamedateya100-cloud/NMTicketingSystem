<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول - الدعم التقني</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white text-center"><h5>دخول قسم الدعم الفني</h5></div>
                    <div class="card-body">
                        <form method="POST">
                            <input type="text" name="username" class="form-control mb-3" placeholder="اسم المستخدم" required>
                            <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور" required>
                            <button type="submit" class="btn btn-primary w-100">دخول</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول - قسم المشتريات</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow border-0">
                    <!-- هنا استخدمنا warning عشان اللون يبقى أصفر مميز للمشتريات -->
                    <div class="card-header bg-warning text-dark text-center"><h5>دخول قسم المشتريات</h5></div>
                    <div class="card-body">
                        <form method="POST">
                            <input type="text" name="username" class="form-control mb-3" placeholder="اسم المستخدم" required>
                            <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور" required>
                            <button type="submit" class="btn btn-warning w-100 fw-bold">دخول</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html></html>
