
{% block content %}
<link class="abs" rel="stylesheet" href="/static/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<div class="container-fluid" dir="rtl" style="background-color: #f8fafc; min-height: 85vh; padding-top: 80px;">
    <div class="card shadow-lg border-0 mx-auto" style="border-radius: 20px; max-width: 650px; background: #ffffff;">
        <div class="card-body text-center py-5 px-4">
            <div class="mb-4 d-flex align-items-center justify-content-center mx-auto" style="width: 120px; height: 120px; background-color: #fff9db; border-radius: 50%;">
                <i class="fas fa-tools fa-4x" style="color: #f59f00; animation: wrench 2.5s infinite ease-in-out;"></i>
            </div>
            <h2 class="fw-bold text-dark mb-3">Under Construction</h2>
            <p class="text-secondary fs-5 mb-4 px-3" style="line-height: 1.8;">
                 إحنا شغالين حالياً على بناء وتطوير موديول إدارة المشتريات الخاص بشركة <strong class="text-primary">ناشيونال موتورز</strong><br>
                النظام سيكون متاحاً بكافة صلاحياته قريباً جداً 
            </p>
            <a href="{{ url_for('support.portal') }}" class="btn btn-primary px-5 py-3 fw-bold" style="border-radius: 50px; box-shadow: 0 4px 15px rgba(13, 71, 161, 0.3);">
                <i class="fas fa-arrow-right me-2"></i> العودة للبوابة الرئيسية
            </a>
        </div>
    </div>
</div>

<style>
@keyframes wrench {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-15deg); }
    75% { transform: rotate(20deg); }
    100% { transform: rotate(0deg); }
}
</style>
{% endblock %}
